# Cloudflare Tunnel configuration for JheckBot
#
# Place this at /path/to/.cloudflared/config.yml after creating your tunnel.
# Replace <TUNNEL_ID> with your tunnel ID and <TUNNEL_UUID> with the UUID.
#
# Steps:
#   1. cloudflared tunnel login
#   2. cloudflared tunnel create jheckbot
#   3. Copy the tunnel ID and UUID from the output
#   4. Update this config with the tunnel UUID
#   5. Add DNS route: cloudflared tunnel route dns jheckbot <YOUR_DOMAIN>
#   6. Install as service: sudo cloudflared service install
#
# See: https://developers.cloudflare.com/cloudflare-one/connections/connect-networks/

tunnel: <TUNNEL_UUID>
credentials-file: /path/to/.cloudflared/<TUNNEL_UUID>.json

ingress:
  # Route all traffic to the Nuxt web server, which proxies /api to Express
  - hostname: <YOUR_DOMAIN>
    service: http://localhost:8800
  # Catch-all (returns 404)
  - service: http_status:404
