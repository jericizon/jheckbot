# JheckBot Docker Compose
# Phase 1: PostgreSQL development service only.
# Web and API run on the host. Full containerization is deferred.

services:
  postgres:
    image: postgres:18-alpine
    container_name: jheckbot-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_HOST_PORT:-8802}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jheckbot}
      POSTGRES_USER: ${POSTGRES_USER:-jheckbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
    volumes:
      - jheckbot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jheckbot} -d ${POSTGRES_DB:-jheckbot}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  jheckbot_pgdata:
    name: jheckbot_pgdata
